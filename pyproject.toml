[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hilvan"
version = "0.1.0"
description = "Validador de manufacturabilidad para patrones de costura generados"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "svgpathtools>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# los scripts de research/ que miden el corpus y dibujan las figuras del paper;
# los que generan patrones necesitan ademas un clon de GarmentCode
research = ["matplotlib", "pyyaml"]

[project.scripts]
hilvan = "hilvan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
