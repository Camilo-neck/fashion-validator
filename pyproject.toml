[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-validator"
version = "0.1.0"
description = "Validador de manufacturabilidad para patrones de costura generados"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "svgpathtools>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fashion-validator = "fashion_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
