name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Comprobacion de la fusion de vertices
        run: python research/fusion_vertices.py --demo
